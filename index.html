}
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: 242px;
  background: var(--navy);
  color: #acb9bf;
  display: flex;
  flex-direction: column;
  z-index: 40;
  padding: 33px 19px 20px;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  color: white;
  font-size: 29px;
  letter-spacing: -1.3px;
  font-weight: 700;
  padding-left: 11px;
  line-height: 1;
}
.brand-light {
  font-weight: 400;
  color: #e3e9ea;
}
.brand small {
  font-size: 8px;
  letter-spacing: 2.1px;
  display: block;
  margin-top: 10px;
  color: #92a7ae;
  font-weight: 500;
}
.brand-icon {
  width: 36px;
  height: 38px;
  background: #df764d;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  transform: rotate(-6deg);
}
.brand-icon svg {
  transform: rotate(6deg);
}
.workspace-switch {
  display: flex;
  gap: 10px;
  align-items: center;
  border: 1px solid #38505a;
  border-radius: 8px;
  padding: 12px 10px;
  margin-top: 36px;
  font-size: 12px;
  color: #f1f4f5;
}
.workspace-switch > span {
  flex: 1;
  font-weight: 600;
}
.workspace-switch small {
  display: block;
  color: #91a4ad;
  font-size: 9px;
  margin-top: 3px;
  font-weight: 400;
}
.workspace-avatar {
  height: 30px;
  width: 30px;
  display: grid;
  place-items: center;
  background: #3a4d55;
  border-radius: 6px;
  font-size: 14px;
}
.nav-label {
  font-size: 9px;
  letter-spacing: 1.7px;
  color: #80959f;
  padding: 30px 13px 12px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 13px;
  margin: 4px 0;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  transition: 0.15s;
}
.nav-item:hover {
  background: #233d46;
  color: white;
}
.nav-item.active {
  background: #2a444e;
  color: white;
  position: relative;
}
.nav-item.active:before {
  content: "";
  position: absolute;
  left: -19px;
  width: 3px;
  height: 23px;
  border-radius: 0 2px 2px 0;
  background: #ea946c;
}

  color: #e4a07b;
}

}
.help-icon {

}

.search-stages p {

.results-heading {

}
.inline-actions {

.wrap {

.candidate {

}

}
.candidate-badges {

}

.candidate-info {

}

}
.candidate-info h3 {

}
.candidate-info > p {

}

.candidate-price > span {

  color: #9aa59e;

}
.candidate-price > small {

}

}

}
.comparison {

}

}

}
.comparison .preserve-lines {

}
.compare-warning {

.search-history {

}

  padding: 17px 22px;

}

}

}
.review-form .field {

}

}

}

}

.benefit-card > p {

  margin-top: 8px;
}

.benefit-breakdown strong {

}
.life-extension {

.life-extension > span {

.life-extension > strong {

.inline-note {
  display: flex;

.inline-note svg {
  flex-shrink: 0;
  margin-top: 2px;
}
.contacts-layout {

}

}

  padding: 10px 8px;
  color: #85988d;
  margin-top: 5px;

.saved-drafts button > svg {

}
.saved-drafts button.selected {

}
.saved-drafts small {

  margin-top: 5px;
  color: #a1afa6;
}
.empty-state {
  display: flex;
  flex-direction: column;

}
.empty-state > svg {

}
.empty-state h3 {
  font-size: 16px;
  color: #6a8477;
}

  line-height: 1.9;
}
.hotel-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

}
.hotel-card:hover {

}

  width: 47px;
  height: 47px;
  border-radius: 11px;

  place-items: center;
  background: #e8f0e9;
  color: #73977c;
  margin-bottom: 22px;
}
.hotel-color-1 {
  background: #f7eee3;
  color: #bba07d;
}
.hotel-color-2 {
  background: #e9eff4;
  color: #89a0b1;
}
.hotel-color-3 {
  background: #f0ecf6;
  color: #9f8cb2;
}
.hotel-card h2 {
  font-size: 16px;
}
.hotel-card p {
  display: flex;
  gap: 6px;
  align-items: center;
  font-size: 11px;
  color: #91a19f;
  margin-top: 8px;
}
.hotel-card > div:last-child {
  display: flex;
  justify-content: space-between;

  font-size: 11px;
  color: #8da398;
}
.guide-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}
.guide-card {
  padding: 28px;
}
.guide-card > svg {
  color: #93ac9d;
  margin-bottom: 20px;
}
.guide-card h2 {
  font-size: 17px;
  margin-bottom: 16px;
}
.guide-card p {
  font-size: 12px;
  line-height: 2;
  color: #8b9b9a;
}
.guide-cta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 32px;
  margin-top: 22px;
  border-radius: 12px;
  background: #e8efea;
  border: 1px solid #dce6df;
}
.mobile-menu {
  display: none;
}
.loading-page {
  padding: 60px;
  text-align: center;
  color: #7d9386;
}
.spin {
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes pulse {
  50% {
    opacity: 0.5;
  }
}
